# Model Defaults Configuration
# Defines default model tiers per harness.
# Use "model: default-low", "model: default", or "model: default-high"
# in agent/skill files to auto-resolve to harness-specific models.
#
# Format:
#   [harness]
#   tier = model-name
#   tier.field = value   (additional fields set when tier is used)
#
# Per-harness reasoning controls (verified May 2026):
#   Claude Code:  effort                  (low/medium/high/xhigh/max)
#   Codex CLI:    model_reasoning_effort  (low/medium/high)
#   Copilot CLI:  (no documented reasoning field — undocumented hints are ignored)
#   Gemini CLI:   thinkingBudget          (integer; wrapped as thinkingConfig.thinkingBudget)

[codex]
default-low = gpt-5-mini
default-low.model_reasoning_effort = medium
default = gpt-5.5
default.model_reasoning_effort = medium
default-high = gpt-5.5
default-high.model_reasoning_effort = high

[claude]
default-low = claude-haiku-4.5
default-low.effort = medium
default = claude-sonnet-4.6
default.effort = medium
default-high = claude-opus-4.6
default-high.effort = high

[copilot]
default-low = gpt-5-mini
default = claude-opus-4.6
default-high = claude-opus-4.6

[gemini]
default-low = gemini-3.1-flash-lite
default-low.thinkingBudget = 4096
default = gemini-3.1-flash
default.thinkingBudget = 4096
default-high = gemini-3.1-pro
default-high.thinkingBudget = 16384
